<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>职场英语每日一练 · 2026-10-23</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --teal:#0d9488; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    min-height:100vh; padding:32px 18px 70px;
  }
  .wrap{max-width:920px;margin:0 auto}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:26px;letter-spacing:1px}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:3px;margin-top:5px}
  .date-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--muted);box-shadow:0 1px 3px rgba(15,23,42,.05);white-space:nowrap}
  .sub{margin-top:10px;color:var(--muted);font-size:14px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .rate-group{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .rate-group .lbl{font-size:13px;color:var(--muted);padding:0 8px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px;color:var(--muted)}
  .rate-btn{padding:6px 10px;border-radius:8px}
  .rate-btn:hover{background:#eef2f7;color:var(--ink)}
  .rate-btn.active{background:var(--blue);color:#fff;font-weight:600}
  .btn-primary{background:var(--blue);color:#fff;padding:10px 18px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.28)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:11px;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  section{margin-top:34px}
  .sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .sec-head .icon{font-size:18px}
  .sec-head h2{font-size:19px}
  .sec-head h2 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:1px}
  .sec-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
  .s-words{--acc:var(--blue)} .s-phrases{--acc:var(--teal)} .s-sentences{--acc:var(--amber)}
  .s-words .sec-head h2{color:var(--blue)} .s-phrases .sec-head h2{color:var(--teal)} .s-sentences .sec-head h2{color:var(--amber)}
  .grid{display:grid;gap:13px}
  .grid.g2{grid-template-columns:repeat(auto-fill,minmax(275px,1fr))}
  .grid.g1{grid-template-columns:1fr}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.05);transition:transform .16s,box-shadow .16s,border-color .16s;user-select:none}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(15,23,42,.09)}
  .card:focus-visible{outline:2px solid var(--acc,var(--blue));outline-offset:2px}
  .card .spk{position:absolute;top:13px;right:15px;font-size:14px;opacity:.22;transition:opacity .16s}
  .card:hover .spk{opacity:.65}
  .card.speaking{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.14),0 10px 20px rgba(15,23,42,.10)}
  .card.speaking .spk{opacity:1;animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
  .card .en{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;color:#0f172a;line-height:1.4}
  .card .uk{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;font-weight:400;color:var(--muted);margin-left:9px}
  .card .zh{margin-top:7px;font-size:14px;color:var(--muted);line-height:1.65}
  .s-sentences .card .en{font-size:17px;font-weight:400}
  .back-home{display:inline-flex;align-items:center;text-decoration:none;color:var(--blue);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:16px;transition:border-color .16s,box-shadow .16s}
  .back-home:hover{border-color:var(--blue);box-shadow:0 4px 10px rgba(15,23,42,.08)}
  footer{margin-top:44px;text-align:center;font-size:12.5px;color:var(--muted)}
  @media (max-width:560px){ h1{font-size:22px} .card .en{font-size:19px} }
</style>
</head>
<body>
<!-- 每日更新说明：只需修改 <title>、.date-chip 日期、.sub 文案与 DATA 数组，其余结构与样式保持不变 -->
<div class="wrap">
  <a class="back-home" href="index.html">← 返回主页</a>
  <header>
    <div class="title-row">
      <h1>职场英语每日一练<small>DAILY WORKPLACE ENGLISH</small></h1>
      <span class="date-chip">2026-10-23 · 星期五</span>
    </div>
    <p class="sub">今天共 15 个知识点：单词、短语、句子各 5 个，点击卡片即可朗读英文。</p>
    <div class="toolbar">
      <div class="rate-group"><span class="lbl">语速</span>
        <button class="rate-btn" data-rate="0.7">0.7×</button>
        <button class="rate-btn" data-rate="0.85">0.85×</button>
        <button class="rate-btn active" data-rate="1">1.0×</button>
      </div>
      <button class="btn-primary" id="btnAll">🔊 连读全部</button>
      <button class="btn-ghost" id="btnStop">停止</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>💡 点击任意卡片听发音 · 语速可切换 · 支持一键连读 ｜ 每日 07:00 由 TeleAgent 自动生成</footer>
</div>
<script>
"use strict";
/* ===== 今日内容（每日更新） ===== */
var DATA = {
  words: [
    { en: "allocation",   uk: "/ˌæləˈkeɪʃn/",   zh: "n. （预算、资源等的）分配；配额" },
    { en: "expenditure",  uk: "/ɪkˈspendɪtʃə/",  zh: "n. 支出；开销" },
    { en: "appraisal",    uk: "/əˈpreɪzl/",      zh: "n. 绩效评估；工作考评" },
    { en: "attrition",    uk: "/əˈtrɪʃn/",       zh: "n. （人员）自然流失；减员" },
    { en: "shortfall",    uk: "/ˈʃɔːtfɔːl/",     zh: "n. 缺口；差额（未达标的部分）" }
  ],
  phrases: [
    { en: "balance the books", zh: "做平账目；结清账目" },
    { en: "on track",          zh: "按计划推进；进展正常" },
    { en: "in the red",        zh: "出现赤字；亏损" },
    { en: "tighten one's belt", zh: "缩减开支；勒紧裤腰带" },
    { en: "cut corners",       zh: "偷工减料；图省事走捷径" }
  ],
  sentences: [
    { en: "The finance team is finalizing next year's budget allocation, so please submit your cost estimates by Wednesday.", zh: "财务团队正在敲定明年的预算分配，请在周三前提交你们的费用估算。" },
    { en: "Your annual appraisal is scheduled for next Monday — please come prepared with a brief self-review.", zh: "你的年度绩效评估安排在下周一，请提前准备一份简短的自我总结。" },
    { en: "Year-end is approaching, so let's tighten our belts and defer any non-essential expenditures.", zh: "年底将至，我们先收紧开支，把非必要的支出往后推一推。" },
    { en: "The project ran in the red for two quarters before it finally broke even.", zh: "这个项目连续两个季度亏损，直到最近才实现收支平衡。" },
    { en: "Despite some staff attrition this year, the team is still on track and expects to close the revenue shortfall by December.", zh: "尽管今年有一些人员流失，团队整体仍在正轨上，预计 12 月前可以补上收入缺口。" }
  ]
};
var SECTIONS = [
  { key: "words",     icon: "📘", cn: "单词", en: "WORDS",     cols: "g2" },
  { key: "phrases",   icon: "💬", cn: "短语", en: "PHRASES",   cols: "g2" },
  { key: "sentences", icon: "🗣️", cn: "句子", en: "SENTENCES", cols: "g1" }
];

/* ===== 渲染卡片 ===== */
var main = document.getElementById("main");
SECTIONS.forEach(function (sec) {
  var section = document.createElement("section");
  section.className = "s-" + sec.key;
  var head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML = '<span class="icon">' + sec.icon + '</span><h2>' + sec.cn + '<span>' + sec.en + '</span></h2><span class="cnt">' + DATA[sec.key].length + ' 个</span>';
  var grid = document.createElement("div");
  grid.className = "grid " + sec.cols;
  DATA[sec.key].forEach(function (item) {
    var card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "朗读英文：" + item.en);
    card.dataset.en = item.en;
    var spk = document.createElement("span"); spk.className = "spk"; spk.textContent = "🔊";
    var en = document.createElement("div"); en.className = "en"; en.textContent = item.en;
    if (item.uk) { var uk = document.createElement("span"); uk.className = "uk"; uk.textContent = item.uk; en.appendChild(uk); }
    var zh = document.createElement("div"); zh.className = "zh"; zh.textContent = item.zh;
    card.appendChild(spk); card.appendChild(en); card.appendChild(zh);
    grid.appendChild(card);
  });
  section.appendChild(head); section.appendChild(grid);
  main.appendChild(section);
});

/* ===== 朗读引擎：浏览器内置 speechSynthesis，零外部依赖 ===== */
var voice = null, rate = 1, genCounter = 0, lastCard = null;

function pickVoice() {
  var vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  function score(v) {
    var s = 0;
    if (/^en/i.test(v.lang)) s += 10;
    if (/en[-_]us/i.test(v.lang)) s += 3;
    if (/natural|online|neural/i.test(v.name)) s += 4;
    if (/aria|jenny|guy|emma|libby|zira|david|sara/i.test(v.name)) s += 2;
    return s;
  }
  vs = vs.slice().sort(function (a, b) { return score(b) - score(a); });
  voice = (vs[0] && /^en/i.test(vs[0].lang)) ? vs[0] : null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function clearMark() {
  var list = document.querySelectorAll(".card.speaking");
  for (var i = 0; i < list.length; i++) list[i].classList.remove("speaking");
}

/* gen 参数供连读序列使用：不增加代数即可续接播放；单独点击/停止会递增代数使旧序列失效 */
function speakCard(card, gen) {
  var myGen = (typeof gen === "number") ? gen : ++genCounter;
  speechSynthesis.cancel();
  clearMark();
  lastCard = card;
  card.classList.add("speaking");
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (myGen !== genCounter) { card.classList.remove("speaking"); resolve(); return; }
      var u = new SpeechSynthesisUtterance(card.dataset.en);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-US"; }
      u.rate = rate;
      var wd = null;
      function done() {
        clearTimeout(wd);
        if (myGen === genCounter) card.classList.remove("speaking");
        resolve();
      }
      u.onend = done; u.onerror = done;
      wd = setTimeout(done, Math.max(4000, card.dataset.en.length * 200));
      speechSynthesis.speak(u);
    }, 40);
  });
}

function stopAll() { genCounter++; speechSynthesis.cancel(); clearMark(); }

main.addEventListener("click", function (e) {
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (!card) return;
  speakCard(card);
});
main.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (!card) return;
  e.preventDefault();
  speakCard(card);
});

document.getElementById("btnAll").addEventListener("click", function () {
  speechSynthesis.cancel();
  clearMark();
  var gen = ++genCounter;
  var cards = document.querySelectorAll(".card");
  var i = 0;
  (function next() {
    if (gen !== genCounter || i >= cards.length) return;
    speakCard(cards[i], gen).then(function () {
      if (gen !== genCounter) return;
      i++;
      if (i < cards.length) setTimeout(next, 350);
    });
  })();
});

document.getElementById("btnStop").addEventListener("click", stopAll);

Array.prototype.forEach.call(document.querySelectorAll(".rate-btn"), function (btn) {
  btn.addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".rate-btn"), function (b) { b.classList.toggle("active", b === btn); });
    rate = parseFloat(btn.dataset.rate);
    if (speechSynthesis.speaking && lastCard) speakCard(lastCard);
  });
});

window.addEventListener("beforeunload", function () { speechSynthesis.cancel(); });
</script>
</body>
</html>
