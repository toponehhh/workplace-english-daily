<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>职场英语每日一练 · 2026-10-27</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --teal:#0d9488; --amber:#d97706;
    --ink-strong:#0f172a; --hover:#eef2f7; --on-accent:#ffffff;
    --shadow:rgba(15,23,42,.05); --shadow-lg:rgba(15,23,42,.09);
    color-scheme:light dark;
  }
  html[data-theme="dark"]{
    --bg:#0b1220; --card:#151f31; --ink:#e2e8f0; --muted:#94a3b8; --line:#2a3a54;
    --blue:#60a5fa; --teal:#2dd4bf; --amber:#fbbf24;
    --ink-strong:#f1f5f9; --hover:#223046; --on-accent:#0b1220;
    --shadow:rgba(0,0,0,.35); --shadow-lg:rgba(0,0,0,.5);
    color-scheme:dark;
  }
  html[data-theme="light"]{ color-scheme:light; }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]):not([data-theme="dark"]){
      --bg:#0b1220; --card:#151f31; --ink:#e2e8f0; --muted:#94a3b8; --line:#2a3a54;
      --blue:#60a5fa; --teal:#2dd4bf; --amber:#fbbf24;
      --ink-strong:#f1f5f9; --hover:#223046; --on-accent:#0b1220;
      --shadow:rgba(0,0,0,.35); --shadow-lg:rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    min-height:100vh; padding:32px 18px 70px;
  }
  .wrap{max-width:920px;margin:0 auto}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:26px;letter-spacing:1px}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:3px;margin-top:5px}
  .date-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--muted);box-shadow:0 1px 3px var(--shadow);white-space:nowrap}
  .sub{margin-top:10px;color:var(--muted);font-size:14px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .rate-group{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 1px 3px var(--shadow)}
  .rate-group .lbl{font-size:13px;color:var(--muted);padding:0 8px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px;color:var(--muted)}
  .rate-btn{padding:6px 10px;border-radius:8px}
  .rate-btn:hover{background:var(--hover);color:var(--ink)}
  .rate-btn.active{background:var(--blue);color:var(--on-accent);font-weight:600}
  .btn-primary{background:var(--blue);color:var(--on-accent);padding:10px 18px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(37,99,235,.28)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:11px;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  .theme-group{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 1px 3px var(--shadow)}
  .theme-btn{padding:6px 10px;border-radius:8px}
  .theme-btn:hover{background:var(--hover);color:var(--ink)}
  .theme-btn.active{background:var(--blue);color:var(--on-accent);font-weight:600}
  section{margin-top:34px}
  .sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .sec-head .icon{font-size:18px}
  .sec-head h2{font-size:19px}
  .sec-head h2 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:1px}
  .sec-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
  .s-words{--acc:var(--blue)} .s-phrases{--acc:var(--teal)} .s-sentences{--acc:var(--amber)}
  .s-words .sec-head h2{color:var(--blue)} .s-phrases .sec-head h2{color:var(--teal)} .s-sentences .sec-head h2{color:var(--amber)}
  .grid{display:grid;gap:13px}
  .grid.g2{grid-template-columns:repeat(auto-fill,minmax(275px,1fr))}
  .grid.g1{grid-template-columns:1fr}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 18px;cursor:pointer;box-shadow:0 1px 3px var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;user-select:none}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 20px var(--shadow-lg)}
  .card:focus-visible{outline:2px solid var(--acc,var(--blue));outline-offset:2px}
  .card .spk{position:absolute;top:13px;right:15px;font-size:14px;opacity:.22;transition:opacity .16s}
  .card:hover .spk{opacity:.65}
  .card.speaking{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.14),0 10px 20px var(--shadow-lg)}
  .card.speaking .spk{opacity:1;animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
  .card .en{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;color:var(--ink-strong);line-height:1.4}
  .card .uk{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;font-weight:400;color:var(--muted);margin-left:9px}
  .card .zh{margin-top:7px;font-size:14px;color:var(--muted);line-height:1.65}
  .s-sentences .card .en{font-size:17px;font-weight:400}
  .back-home{display:inline-flex;align-items:center;text-decoration:none;color:var(--blue);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;box-shadow:0 1px 3px var(--shadow);margin-bottom:16px;transition:border-color .16s,box-shadow .16s}
  .back-home:hover{border-color:var(--blue);box-shadow:0 4px 10px rgba(37,99,235,.08)}
  footer{margin-top:44px;text-align:center;font-size:12.5px;color:var(--muted)}
  @media (max-width:560px){ h1{font-size:22px} .card .en{font-size:19px} }
</style>
<script>
/* 主题初始化：优先应用本地保存的显式偏好；未设置时交给 CSS 跟随系统 */
(function(){try{var t=localStorage.getItem("we-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();
</script>
</head>
<body>
<!-- 每日更新说明：只需修改 <title>、.date-chip 日期、.sub 文案与 DATA 数组，其余结构与样式保持不变 -->
<div class="wrap">
  <a class="back-home" href="index.html">← 返回主页</a>
  <header>
    <div class="title-row">
      <h1>职场英语每日一练<small>DAILY WORKPLACE ENGLISH</small></h1>
      <span class="date-chip">2026-10-27 · 星期二</span>
    </div>
    <p class="sub">今天共 15 个知识点：单词、短语、句子各 5 个，点击卡片即可朗读英文。今日主题：客户沟通与服务维系。</p>
    <div class="toolbar">
      <div class="rate-group"><span class="lbl">语速</span>
        <button class="rate-btn" data-rate="0.7">0.7×</button>
        <button class="rate-btn" data-rate="0.85">0.85×</button>
        <button class="rate-btn active" data-rate="1">1.0×</button>
      </div>
      <button class="btn-primary" id="btnAll">🔊 连读全部</button>
      <button class="btn-ghost" id="btnStop">停止</button>
      <div class="theme-group" role="group" aria-label="主题切换">
        <button type="button" class="theme-btn" data-mode="auto">跟随系统</button>
        <button type="button" class="theme-btn" data-mode="light">浅色</button>
        <button type="button" class="theme-btn" data-mode="dark">深色</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <footer>💡 点击任意卡片听发音 · 语速可切换 · 支持一键连读 ｜ 每日 07:00 由 TeleAgent 自动生成</footer>
</div>
<script>
"use strict";
/* ===== 今日内容（每日更新） ===== */
var DATA = {
  words: [
    { en: "client",    uk: "/ˈklaɪənt/",    zh: "n. 客户；委托人（长期专业服务对象，比 customer 更显稳固）" },
    { en: "complaint", uk: "/kəmˈpleɪnt/",  zh: "n. 投诉；不满（处理投诉＝handle a complaint）" },
    { en: "inquiry",   uk: "/ɪnˈkwaɪəri/",  zh: "n. 咨询；问询；询价（回应咨询＝respond to an inquiry）" },
    { en: "retention", uk: "/rɪˈtenʃn/",    zh: "n. 留存；维系（客户留存率＝client retention rate）" },
    { en: "goodwill",  uk: "/ˌɡʊdˈwɪl/",    zh: "n. 商誉；友好关系（维护口碑＝preserve goodwill）" }
  ],
  phrases: [
    { en: "meet someone halfway",              zh: "各让一步；折中达成一致（谈判让步的经典说法）" },
    { en: "keep someone posted",              zh: "随时向某人通报最新进展（＝keep someone updated）" },
    { en: "under-promise and over-deliver",   zh: "承诺留余地，交付超预期（客服黄金法则）" },
    { en: "make it up to someone",            zh: "弥补某人；用行动补偿对方的损失或不快" },
    { en: "put yourself in the client's shoes", zh: "换位思考；设身处地站在客户角度想问题" }
  ],
  sentences: [
    { en: "I understand your frustration, and I'm sorry for the inconvenience this has caused.", zh: "我理解您的心情，对由此造成的不便我深表歉意。（投诉处理第一步：共情）" },
    { en: "Thank you for bringing this to our attention—we'll get back to you within one business day.", zh: "感谢您向我们反馈这个问题，我们会在一个工作日内给您答复。" },
    { en: "I'll keep you posted as soon as we hear back from the technical team.", zh: "技术团队一有回复，我就会第一时间向您同步进展。" },
    { en: "Let's meet halfway: we can offer a ten percent discount on your next renewal.", zh: "我们各让一步吧：下次续约时可以给您九折优惠。" },
    { en: "We value your business and will do everything we can to make it right.", zh: "我们非常珍视与您的合作，会尽全力把这件事处理好。" }
  ]
};
var SECTIONS = [
  { key: "words",     icon: "📘", cn: "单词", en: "WORDS",     cols: "g2" },
  { key: "phrases",   icon: "💬", cn: "短语", en: "PHRASES",   cols: "g2" },
  { key: "sentences", icon: "🗣️", cn: "句子", en: "SENTENCES", cols: "g1" }
];

/* ===== 渲染卡片 ===== */
var main = document.getElementById("main");
SECTIONS.forEach(function (sec) {
  var section = document.createElement("section");
  section.className = "s-" + sec.key;
  var head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML = '<span class="icon">' + sec.icon + '</span><h2>' + sec.cn + '<span>' + sec.en + '</span></h2><span class="cnt">' + DATA[sec.key].length + ' 个</span>';
  var grid = document.createElement("div");
  grid.className = "grid " + sec.cols;
  DATA[sec.key].forEach(function (item) {
    var card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", "朗读英文：" + item.en);
    card.dataset.en = item.en;
    var spk = document.createElement("span"); spk.className = "spk"; spk.textContent = "🔊";
    var en = document.createElement("div"); en.className = "en"; en.textContent = item.en;
    if (item.uk) { var uk = document.createElement("span"); uk.className = "uk"; uk.textContent = item.uk; en.appendChild(uk); }
    var zh = document.createElement("div"); zh.className = "zh"; zh.textContent = item.zh;
    card.appendChild(spk); card.appendChild(en); card.appendChild(zh);
    grid.appendChild(card);
  });
  section.appendChild(head); section.appendChild(grid);
  main.appendChild(section);
});

/* ===== 朗读引擎：浏览器内置 speechSynthesis，零外部依赖 ===== */
var voice = null, rate = 1, genCounter = 0, lastCard = null;

function pickVoice() {
  var vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  function score(v) {
    var s = 0;
    if (/^en/i.test(v.lang)) s += 10;
    if (/en[-_]us/i.test(v.lang)) s += 3;
    if (/natural|online|neural/i.test(v.name)) s += 4;
    if (/aria|jenny|guy|emma|libby|zira|david|sara/i.test(v.name)) s += 2;
    return s;
  }
  vs = vs.slice().sort(function (a, b) { return score(b) - score(a); });
  voice = (vs[0] && /^en/i.test(vs[0].lang)) ? vs[0] : null;
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();

function clearMark() {
  var list = document.querySelectorAll(".card.speaking");
  for (var i = 0; i < list.length; i++) list[i].classList.remove("speaking");
}

/* gen 参数供连读序列使用：不增加代数即可续接播放；单独点击/停止会递增代数使旧序列失效 */
function speakCard(card, gen) {
  var myGen = (typeof gen === "number") ? gen : ++genCounter;
  speechSynthesis.cancel();
  clearMark();
  lastCard = card;
  card.classList.add("speaking");
  return new Promise(function (resolve) {
    setTimeout(function () {
      if (myGen !== genCounter) { card.classList.remove("speaking"); resolve(); return; }
      var u = new SpeechSynthesisUtterance(card.dataset.en);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-US"; }
      u.rate = rate;
      var wd = null;
      function done() {
        clearTimeout(wd);
        if (myGen === genCounter) card.classList.remove("speaking");
        resolve();
      }
      u.onend = done; u.onerror = done;
      wd = setTimeout(done, Math.max(4000, card.dataset.en.length * 200));
      speechSynthesis.speak(u);
    }, 40);
  });
}

function stopAll() { genCounter++; speechSynthesis.cancel(); clearMark(); }

main.addEventListener("click", function (e) {
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (!card) return;
  speakCard(card);
});
main.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var card = e.target.closest ? e.target.closest(".card") : null;
  if (!card) return;
  e.preventDefault();
  speakCard(card);
});

document.getElementById("btnAll").addEventListener("click", function () {
  speechSynthesis.cancel();
  clearMark();
  var gen = ++genCounter;
  var cards = document.querySelectorAll(".card");
  var i = 0;
  (function next() {
    if (gen !== genCounter || i >= cards.length) return;
    speakCard(cards[i], gen).then(function () {
      if (gen !== genCounter) return;
      i++;
      if (i < cards.length) setTimeout(next, 350);
    });
  })();
});

document.getElementById("btnStop").addEventListener("click", stopAll);

Array.prototype.forEach.call(document.querySelectorAll(".rate-btn"), function (btn) {
  btn.addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".rate-btn"), function (b) { b.classList.toggle("active", b === btn); });
    rate = parseFloat(btn.dataset.rate);
    if (speechSynthesis.speaking && lastCard) speakCard(lastCard);
  });
});

/* ===== 主题切换：跟随系统 / 浅色 / 深色，偏好存 localStorage（键 we-theme） ===== */
var THEME_KEY = "we-theme";
function themeMode(){
  try{var t=localStorage.getItem(THEME_KEY);if(t==="light"||t==="dark")return t;}catch(e){}
  return "auto";
}
function setThemeMode(mode){
  if(mode==="light"||mode==="dark"){document.documentElement.setAttribute("data-theme",mode);}
  else{document.documentElement.removeAttribute("data-theme");}
  try{
    if(mode==="light"||mode==="dark"){localStorage.setItem(THEME_KEY,mode);}
    else{localStorage.removeItem(THEME_KEY);}
  }catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll(".theme-btn"),function(b){b.classList.toggle("active",b.dataset.mode===mode);});
}
Array.prototype.forEach.call(document.querySelectorAll(".theme-btn"),function(btn){
  btn.addEventListener("click",function(){setThemeMode(btn.dataset.mode);});
});
setThemeMode(themeMode());
window.addEventListener("beforeunload", function () { speechSynthesis.cancel(); });
</script>
</body>
</html>
